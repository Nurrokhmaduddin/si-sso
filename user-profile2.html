<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile - Enterprise</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background: #f4f6f9;
    }
    .card {
      border-radius: 12px;
    }
    .readonly input {
      background-color: #e9ecef;
      pointer-events: none;
    }
    .strength-bar {
      height: 6px;
      border-radius: 4px;
      background: #ddd;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      width: 0%;
      transition: 0.3s;
    }
  </style>
</head>

<body>

<div class="container mt-4">

  <h3 class="mb-4"><i class="fa fa-user"></i> User Profile</h3>

  <!-- Tabs -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#profile">
        <i class="fa fa-user"></i> Informasi Profil
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#security">
        <i class="fa fa-lock"></i> Keamanan Akun
      </button>
    </li>
  </ul>

  <div class="tab-content">

    <!-- ================= PROFIL ================= -->
    <div class="tab-pane fade show active" id="profile">

      <div class="card p-4">

        <div class="d-flex justify-content-between mb-3">
          <h5><i class="fa fa-id-card"></i> Data Profil</h5>
          <button class="btn btn-outline-primary btn-sm" onclick="enableEdit()">
            <i class="fa fa-edit"></i> Edit Profil
          </button>
        </div>

        <form id="profileForm" class="readonly">

          <div class="mb-3">
            <label class="form-label">Nama</label>
            <input type="text" class="form-control" value="Reko Mustika Sari">
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" value="reko@example.com">
          </div>

          <div class="mb-3">
            <label class="form-label">No. Telepon</label>
            <input type="text" class="form-control" value="08123456789">
          </div>

          <div class="mt-3 d-none" id="profileActions">
            <button class="btn btn-primary">
              <i class="fa fa-save"></i> Simpan
            </button>
            <button type="button" class="btn btn-secondary" onclick="cancelEdit()">
              Batal
            </button>
          </div>

        </form>

      </div>

    </div>

    <!-- ================= SECURITY ================= -->
    <div class="tab-pane fade" id="security">

      <div class="card p-4">

        <h5 class="mb-3"><i class="fa fa-shield-alt"></i> Ubah Password</h5>

        <form>

          <div class="mb-3">
            <label>Password Lama</label>
            <input type="password" class="form-control">
          </div>

          <div class="mb-3">
            <label>Password Baru</label>
            <input type="password" class="form-control" id="newPassword" onkeyup="checkStrength()">
          </div>

          <!-- Strength Indicator -->
          <div class="mb-3">
            <small>Kekuatan Password</small>
            <div class="strength-bar">
              <div id="strengthFill" class="strength-fill"></div>
            </div>
            <small id="strengthText"></small>
          </div>

          <div class="mb-3">
            <label>Konfirmasi Password</label>
            <input type="password" class="form-control">
          </div>

          <button class="btn btn-primary">
            <i class="fa fa-key"></i> Update Password
          </button>

        </form>

        <hr>

        <!-- Info tambahan -->
        <div class="mt-3">
          <p><strong>Terakhir ganti password:</strong> 12 Feb 2026</p>
          <p><strong>Login terakhir:</strong> 17 Mar 2026, 09:21 WIB</p>
        </div>

      </div>

    </div>

  </div>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

function enableEdit() {
  document.getElementById("profileForm").classList.remove("readonly");
  document.getElementById("profileActions").classList.remove("d-none");
}

function cancelEdit() {
  document.getElementById("profileForm").classList.add("readonly");
  document.getElementById("profileActions").classList.add("d-none");
}

function checkStrength() {
  let val = document.getElementById("newPassword").value;
  let strength = 0;

  if (val.length > 5) strength++;
  if (val.match(/[A-Z]/)) strength++;
  if (val.match(/[0-9]/)) strength++;
  if (val.match(/[^A-Za-z0-9]/)) strength++;

  let fill = document.getElementById("strengthFill");
  let text = document.getElementById("strengthText");

  if (strength <= 1) {
    fill.style.width = "25%";
    fill.style.background = "red";
    text.innerHTML = "Lemah";
  } else if (strength == 2) {
    fill.style.width = "50%";
    fill.style.background = "orange";
    text.innerHTML = "Sedang";
  } else if (strength == 3) {
    fill.style.width = "75%";
    fill.style.background = "blue";
    text.innerHTML = "Kuat";
  } else {
    fill.style.width = "100%";
    fill.style.background = "green";
    text.innerHTML = "Sangat Kuat";
  }
}

</script>

</body>
</html>
