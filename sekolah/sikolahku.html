<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SikolahKu — Sistem Manajemen Sekolah</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet"/>
<style>
:root {
  --green: #1a6b45;
  --green-mid: #2d9265;
  --green-light: #e6f5ee;
  --green-soft: #c8ecd9;
  --amber: #d97706;
  --amber-light: #fef3c7;
  --red: #dc2626;
  --red-light: #fee2e2;
  --blue: #2563eb;
  --blue-light: #dbeafe;
  --teal: #0f766e;
  --teal-light: #ccfbf1;
  --slate: #1e293b;
  --slate-mid: #334155;
  --slate-soft: #64748b;
  --slate-muted: #94a3b8;
  --border: #e2e8f0;
  --bg: #f1f5f9;
  --surface: #ffffff;
  --text: #0f172a;
  --text-2: #334155;
  --text-3: #64748b;
  --sidebar-w: 256px;
  --radius: 12px;
  --radius-sm: 8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}

/* LAYOUT */
.app{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar-w);background:var(--slate);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .3s;}
.main-wrap{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;}

/* SIDEBAR */
.sb-brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.sb-logo{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:-0.5px;}
.sb-logo span{color:var(--green-mid);}
.sb-tagline{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;letter-spacing:.4px;}

.sb-role-pill{margin:14px 16px 0;background:rgba(255,255,255,.08);border-radius:40px;padding:8px 12px;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.1);}
.sb-role-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.sb-role-name{font-size:12px;font-weight:600;color:#fff;line-height:1.2;}
.sb-role-sub{font-size:10px;color:rgba(255,255,255,.45);}

.sb-nav{flex:1;overflow-y:auto;padding:16px 10px;}
.sb-section-label{font-size:9.5px;letter-spacing:1.2px;color:rgba(255,255,255,.3);font-weight:700;padding:12px 10px 6px;text-transform:uppercase;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;transition:all .15s;position:relative;}
.sb-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.sb-item.active{background:var(--green);color:#fff;font-weight:600;}
.sb-item.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--green-mid);border-radius:0 3px 3px 0;}
.sb-item svg{width:16px;height:16px;flex-shrink:0;opacity:.8;}
.sb-item.active svg{opacity:1;}
.sb-badge{margin-left:auto;background:var(--amber);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
.sb-badge.green{background:var(--green-mid);}

.sb-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);}
.sb-logout{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.4);cursor:pointer;padding:6px 4px;border-radius:6px;transition:color .15s;}
.sb-logout:hover{color:rgba(255,255,255,.7);}

/* TOPBAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-left{display:flex;align-items:center;gap:14px;}
.breadcrumb{font-size:13px;color:var(--text-3);display:flex;align-items:center;gap:6px;}
.breadcrumb strong{color:var(--text);font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.notif-btn{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
.notif-dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid var(--surface);}
.role-switcher{font-size:12px;padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit;font-weight:500;}
.date-chip{font-size:12px;color:var(--text-3);background:var(--bg);padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);}
.btn-create-plan{display:none;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:8px 18px;border-radius:var(--radius-sm);background:var(--green);color:#fff;border:none;cursor:pointer;font-family:inherit;text-decoration:none;transition:all .2s;box-shadow:0 2px 8px rgba(26,107,69,.25);}
.btn-create-plan:hover{background:#155534;box-shadow:0 4px 16px rgba(26,107,69,.35);transform:translateY(-1px);}
.btn-create-plan svg{width:15px;height:15px;}
.wali-kelas-only{display:none;}

.btn-view-keuangan{display:none;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:8px 18px;border-radius:var(--radius-sm);background:var(--green);color:#fff;border:none;cursor:pointer;font-family:inherit;text-decoration:none;transition:all .2s;box-shadow:0 2px 8px rgba(26,107,69,.25);}
.btn-view-keuangan:hover{background:#155534;box-shadow:0 4px 16px rgba(26,107,69,.35);transform:translateY(-1px);}
.btn-view-keuangan svg{width:15px;height:15px;}
.pengelola-only{display:none;}

/* Farming row amber highlight — matches kompetensi table (table-warning theme from PHP) */
.farming-row{background:linear-gradient(to right,#fffbeb,#fef9e7)!important;}
.farming-row td{background:transparent!important;color:#78350f;}
.farming-row td:first-child{border-left:3px solid var(--amber);}
.farming-tag{display:inline-flex;align-items:center;gap:4px;background:#fef3c7;border:1px solid #f59e0b;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:700;color:#92400e;margin-left:6px;}
/* Plan list table */
.plan-list-table td{vertical-align:middle;}
.plan-status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0;}
.week-chip{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:11px;font-weight:700;color:var(--text-3);}
.day-cols{display:flex;gap:3px;}
.day-chip{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;}

/* CONTENT */
.content{padding:24px 28px;flex:1;}
.page{display:none;}
.page.active{display:block;}

/* CARDS & STATS */
.kpi-grid{display:grid;gap:16px;margin-bottom:24px;}
.kpi-grid-4{grid-template-columns:repeat(4,1fr);}
.kpi-grid-3{grid-template-columns:repeat(3,1fr);}
.kpi-grid-2{grid-template-columns:repeat(2,1fr);}
.kpi{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:18px 20px;position:relative;overflow:hidden;}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:3px;}
.kpi-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px;}
.kpi-val{font-size:28px;font-weight:800;color:var(--text);line-height:1;font-family:'Fraunces',serif;}
.kpi-label{font-size:12px;color:var(--text-3);margin-top:4px;font-weight:500;}
.kpi-sub{font-size:11px;color:var(--text-3);margin-top:6px;display:flex;align-items:center;gap:4px;}
.kpi-up{color:var(--green);}
.kpi-down{color:var(--red);}

/* CARD */
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:20px;}
.card-hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:14px;font-weight:700;color:var(--text);}
.card-subtitle{font-size:12px;color:var(--text-3);margin-top:1px;}
.card-body{padding:20px;}
.card-action{font-size:12px;font-weight:600;color:var(--green);cursor:pointer;}

/* GRID */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;}

/* PAGE HEADER */
.page-hd{margin-bottom:24px;}
.page-hd h1{font-size:24px;font-weight:800;color:var(--text);font-family:'Fraunces',serif;letter-spacing:-.5px;}
.page-hd p{font-size:13px;color:var(--text-3);margin-top:4px;}

/* TABLES */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;padding:10px 16px;text-align:left;background:#f8fafc;border-bottom:1px solid var(--border);}
td{padding:12px 16px;border-bottom:1px solid #f1f5f9;color:var(--text-2);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafafa;}

/* BADGES */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;gap:4px;}
.badge-green{background:var(--green-light);color:var(--green);}
.badge-amber{background:var(--amber-light);color:var(--amber);}
.badge-red{background:var(--red-light);color:var(--red);}
.badge-blue{background:var(--blue-light);color:var(--blue);}
.badge-teal{background:var(--teal-light);color:var(--teal);}
.badge-slate{background:#f1f5f9;color:var(--slate-soft);}
.toast.show{display:flex !important;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* BUTTONS */
.btn{font-size:13px;font-weight:600;padding:8px 18px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:#f8fafc;}
.btn-green{background:var(--green);color:#fff;border-color:var(--green);}
.btn-green:hover{background:#155534;}
.btn-sm{font-size:12px;padding:6px 14px;}
.btn-outline{background:transparent;border:1.5px solid var(--green);color:var(--green);}
.btn-outline:hover{background:var(--green-light);}

/* ACTIVITY FEED */
.feed-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f1f5f9;}
.feed-item:last-child{border-bottom:none;}
.feed-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0;}
.feed-text{font-size:13px;color:var(--text-2);line-height:1.5;}
.feed-time{font-size:11px;color:var(--text-3);margin-top:3px;}

/* PROGRESS */
.prog-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.prog-label{font-size:12px;color:var(--text-2);min-width:140px;font-weight:500;}
.prog-bar{flex:1;height:8px;background:#f1f5f9;border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;background:var(--green);}
.prog-val{font-size:12px;font-weight:700;color:var(--text);min-width:36px;text-align:right;}

/* DONUT CHART (CSS only) */
.donut-wrap{position:relative;width:120px;height:120px;flex-shrink:0;}
.donut{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--green) 0% var(--pct),#f1f5f9 var(--pct) 100%);}
.donut-inner{position:absolute;inset:16px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut-num{font-size:20px;font-weight:800;color:var(--text);font-family:'Fraunces',serif;line-height:1;}
.donut-sub{font-size:9px;color:var(--text-3);font-weight:600;}

/* PLAN TIMELINE */
.plan-timeline{position:relative;padding-left:20px;}
.plan-timeline::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:2px;background:#f1f5f9;}
.plan-row{position:relative;padding:0 0 16px 20px;}
.plan-row::before{content:'';position:absolute;left:-15px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--green-soft);border:2px solid var(--green);}
.plan-time{font-size:10px;font-weight:700;color:var(--text-3);letter-spacing:.5px;margin-bottom:4px;}
.plan-subject{font-size:13px;font-weight:700;color:var(--text);}
.plan-desc{font-size:12px;color:var(--text-3);margin-top:2px;}

/* SCORE BARS */
.score-item{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #f8fafc;}
.score-item:last-child{border-bottom:none;}
.score-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.score-name{font-size:13px;font-weight:500;color:var(--text);flex:1;}
.score-bar-wrap{width:120px;height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden;}
.score-bar-fill{height:100%;border-radius:3px;}
.score-val{font-size:13px;font-weight:700;color:var(--text);min-width:32px;text-align:right;}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-full{grid-column:1/-1;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:12px;font-weight:600;color:var(--text-2);}
.form-input{font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-family:inherit;transition:border-color .15s;outline:none;}
.form-input:focus{border-color:var(--green);}
textarea.form-input{resize:vertical;min-height:80px;}

/* DAILY PLAN FORM (image 5 reference) */
.dp-header{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;padding:16px 20px;background:#f8fafc;border-bottom:1px solid var(--border);}
.dp-meta-label{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.dp-meta-val{font-size:13px;font-weight:600;color:var(--text);}
.dp-budget{font-size:16px;font-weight:800;color:var(--red);font-family:'Fraunces',serif;}
.akhlaq-block{background:var(--green-light);border:1px solid var(--green-soft);border-radius:var(--radius-sm);padding:14px;margin-bottom:16px;}
.quran-block{background:#fefce8;border:1px solid #fde68a;border-radius:var(--radius-sm);padding:14px;margin-bottom:16px;font-size:13px;color:#92400e;font-style:italic;line-height:1.6;}
.aktivitas-table table th{background:var(--green);color:#fff;}

/* WALI MURID child card */
.child-card{background:linear-gradient(135deg,var(--green) 0%,var(--teal) 100%);border-radius:var(--radius);padding:20px;color:#fff;margin-bottom:20px;position:relative;overflow:hidden;}
.child-card::after{content:'🎒';position:absolute;right:20px;bottom:-5px;font-size:64px;opacity:.15;}
.child-name{font-size:22px;font-weight:800;font-family:'Fraunces',serif;}
.child-info{font-size:13px;opacity:.75;margin-top:4px;}
.child-stats{display:flex;gap:24px;margin-top:16px;}
.child-stat-val{font-size:24px;font-weight:800;font-family:'Fraunces',serif;}
.child-stat-label{font-size:11px;opacity:.7;}

/* MURID hero */
.murid-hero{background:linear-gradient(135deg,#1e3a5f 0%,#1a6b45 100%);border-radius:var(--radius);padding:20px 24px;color:#fff;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.murid-hero-text h2{font-size:20px;font-weight:800;font-family:'Fraunces',serif;}
.murid-hero-text p{font-size:13px;opacity:.7;margin-top:4px;}
.murid-hero-badge{font-size:32px;}

/* REPORT block */
.report-block{border-left:3px solid var(--green-soft);padding:10px 14px;margin-bottom:12px;background:#fafafa;border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
.report-block-title{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.report-block-text{font-size:13px;color:var(--text-2);line-height:1.6;}

/* STATUS dot */
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}

/* NOTIF LIST */
.notif-item{display:flex;gap:12px;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:8px;align-items:flex-start;}
.notif-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.notif-title{font-size:13px;font-weight:600;color:var(--text);}
.notif-desc{font-size:12px;color:var(--text-3);margin-top:2px;}
.notif-time{font-size:11px;color:var(--text-3);margin-top:4px;}

/* PAYMENT */
.payment-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f1f5f9;}
.payment-row:last-child{border-bottom:none;}
.payment-name{font-size:13px;font-weight:500;color:var(--text);}
.payment-amount{font-size:14px;font-weight:700;color:var(--text);font-family:'Fraunces',serif;}

/* ANIMASI */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.page.active{animation:fadeUp .25s ease;}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}

/* KEGIATAN CALENDAR-LIKE */
.event-pill{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:8px;}
.event-date-box{background:var(--green);color:#fff;border-radius:var(--radius-sm);padding:4px 8px;text-align:center;min-width:44px;flex-shrink:0;}
.event-day{font-size:18px;font-weight:800;line-height:1;font-family:'Fraunces',serif;}
.event-month{font-size:9px;font-weight:700;letter-spacing:.5px;opacity:.85;}

/* KOMPETENSI PROGRESS */
.komp-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f8fafc;}
.komp-code{font-size:10px;font-weight:700;color:var(--green);background:var(--green-light);padding:2px 7px;border-radius:4px;min-width:54px;text-align:center;}
.komp-name{font-size:12px;color:var(--text-2);flex:1;}
.komp-bar{width:80px;height:5px;background:#f1f5f9;border-radius:3px;overflow:hidden;}
.komp-fill{height:100%;border-radius:3px;background:var(--green);}
.komp-pct{font-size:11px;font-weight:700;color:var(--text-3);min-width:28px;text-align:right;}
</style>
</head>
<body>

<div class="app">

<!-- ═══════════ SIDEBAR ═══════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sb-brand">
    <div class="sb-logo">Sikolah<span>Ku</span></div>
    <div class="sb-tagline">Sistem Manajemen Sekolah Alam</div>
  </div>
  <div class="sb-role-pill" id="sb-role-pill">
    <div class="sb-role-avatar" id="sb-avatar" style="background:#2d9265;color:#fff">AD</div>
    <div>
      <div class="sb-role-name" id="sb-role-name">Admin Sistem</div>
      <div class="sb-role-sub" id="sb-role-sub">Administrator</div>
    </div>
  </div>
  <nav class="sb-nav" id="sb-nav"></nav>
  <div class="sb-footer">
    <div class="sb-logout">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M11 11l3-3-3-3M14 8H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Keluar
    </div>
  </div>
</aside>

<!-- ═══════════ MAIN ═══════════ -->
<div class="main-wrap">
  <div class="topbar">
    <div class="topbar-left">
      <div class="breadcrumb" id="breadcrumb"><strong>Dashboard</strong></div>
    </div>
    <div class="topbar-right">
      <div class="date-chip" id="date-chip"></div>
      <!-- Create Daily Plan button — only shown for wali_kelas role -->
      <a href="daily-plan-form.html" target="_blank" class="btn-create-plan" id="btn-create-plan" title="Buka form Daily Plan">
        <svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Buat Daily Plan
      </a>
      <!-- View Keuangan button — only shown for pengelola role -->

// ── RENDER SIDEBAR NAV ──
function renderNav(roleKey) {
  const role = roles[roleKey];
  const nav = document.getElementById('sb-nav');
  let html = '';
  role.nav.forEach(section => {
    html += `<div class="sb-section-label">${section.label}</div>`;
    section.items.forEach(item => {
      const badge = item.badge ? `<span class="sb-badge${item.badge==='today'?' green':''}">${item.badge}</span>` : '';
      html += `<div class="sb-item" data-page="${item.id}" onclick="navigate('${item.id}',this)">${item.icon}${item.text}${badge}</div>`;
    });
  });
  nav.innerHTML = html;
  // activate dashboard by default
  const first = nav.querySelector('[data-page="dashboard"]');
  if(first) first.classList.add('active');
}

// ── SWITCH ROLE ──
let currentRole = 'admin';
function switchRole(val) {
  currentRole = val;
  const role = roles[val];
  document.getElementById('sb-role-name').textContent = role.label;
  document.getElementById('sb-role-sub').textContent = role.sub;
  const av = document.getElementById('sb-avatar');
  av.textContent = role.avatar;
  av.style.background = role.color;
  // Show "Buat Daily Plan" only for wali_kelas
  const btnPlan = document.getElementById('btn-create-plan');
  btnPlan.style.display = (val === 'wali_kelas') ? 'inline-flex' : 'none';
  renderNav(val);
  navigate('dashboard', document.querySelector('[data-page="dashboard"]'));
  // Show "View Keuangan" only for pengelola
  const btnView = document.getElementById('btn-view-keuangan');
  btnView.style.display = (val === 'pengelola') ? 'inline-flex' : 'none';
  renderNav(val);
  navigate('dashboard', document.querySelector('[data-page="dashboard"]'));
}

<!-- THE WEEKLY TABLE — 5-day grid, matches PHP reference exactly -->
<div class="card" style="overflow:hidden">
  <div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;min-width:900px">

      <!-- Row 1: Day headers -->
      <thead>
        <tr style="background:var(--slate)">
          ${days.map(d=>`<th colspan="2" style="padding:10px 8px;text-align:center;color:#fff;font-size:12px;font-weight:800;letter-spacing:1px;border:1px solid rgba(255,255,255,.15)">${d}</th>`).join('')}
        </tr>
      </thead>

      <tbody>
        <!-- Row 2: Tema per hari (amber — matches table-warning) -->
        <tr style="background:#fef3c7">
          ${themes.map(t=>`<td colspan="2" style="padding:9px 10px;font-size:12px;font-weight:700;color:#92400e;border:1px solid #fde68a">${t}</td>`).join('')}
        </tr>

        <!-- Row 3: Apersepsi + Eksplorasi content -->
        <tr>
          ${apersepsi.map(a=>`<td colspan="2" style="padding:10px;font-size:11.5px;color:var(--text-2);line-height:1.7;border:1px solid var(--border);vertical-align:top;min-width:170px">${a}</td>`).join('')}
        </tr>

        <!-- Row 4: Continue Material (grey — matches table-secondary) -->
        <tr style="background:#f8fafc">
          ${matContinue.map(items=>`<td colspan="2" style="padding:8px 10px;font-size:11px;border:1px solid var(--border);vertical-align:top">
            ${items.length?`<div style="font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px">Continue Material</div>`:''}
            ${items.map(i=>`<div style="display:flex;align-items:center;gap:5px;padding:2px 0;color:var(--text-2)"><span style="color:var(--green)">☑</span>${i}</div>`).join('')}
          </td>`).join('')}
        </tr>

        <!-- Row 5: Uncontinue Material + cost -->
        <tr style="background:#f8fafc">
          ${matUncontinue.map((items,di)=>{
            if(!items.length) return `<td colspan="2" style="border:1px solid var(--border)"></td>`;
            return `<td style="padding:8px 10px;font-size:11px;border:1px solid var(--border);vertical-align:top">
              <div style="font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px">Uncontinue</div>
              ${items.map(([n])=>`<div style="color:var(--text-2);padding:2px 0">${n}</div>`).join('')}
            </td>
            <td style="padding:8px 10px;font-size:11px;border:1px solid var(--border);text-align:right;vertical-align:top">
              <div style="font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px">Rp</div>
              ${items.map(([,p])=>`<div style="color:var(--red);font-weight:600;padding:2px 0">${p}</div>`).join('')}
            </td>`;
          }).join('')}
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Footer total -->
  <div style="padding:12px 20px;border-top:1px solid var(--border);background:#fafbfc;display:flex;justify-content:space-between;align-items:center">
    <div style="font-size:12px;color:var(--text-3)">Catatan: Data terhubung dari Daily Plan masing-masing hari · Auto-aggregated</div>
    <div style="display:flex;align-items:center;gap:16px">
      <div style="font-size:12px;color:var(--text-3)">Total realisasi:</div>
      <div style="font-size:16px;font-weight:800;color:var(--red);font-family:'Fraunces',serif">Rp 18.000</div>
      <span class="badge badge-green">Di bawah budget</span>
    </div>
  </div>
</div>`;}

// ── TOAST helper (in-page) ──
function showToast(msg){
  const t=document.getElementById('toast');
  if(!t) return;
  document.getElementById('toast-msg').textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
