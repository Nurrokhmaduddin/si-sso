<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Sekolah Alam — Sistem Manajemen Terpadu</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#1a6b3c;--green2:#2d8a56;--green3:#e6f4ec;--green4:#b8dfc7;
  --amber:#b5621a;--amber2:#f5e6d3;
  --blue:#1a4a7a;--blue2:#e6eef8;
  --red:#991f1f;--red2:#fdeaea;
  --purple:#4a2d7a;--purple2:#ede6f8;
  --teal:#1a6b6b;--teal2:#e6f4f4;
  --gray:#6b7280;--gray2:#f3f4f6;--gray3:#e5e7eb;--gray4:#374151;
  --white:#fff;--dark:#111827;
  --sidebar-w:240px;--header-h:60px;
  --font:'Plus Jakarta Sans',sans-serif;
  --serif:'Fraunces',serif;
  --radius:10px;--radius-sm:6px;
}
body{font-family:var(--font);background:#f0f2f5;color:var(--dark);font-size:14px;overflow:hidden;height:100vh}

/* ROLE SWITCHER */
#role-switcher{position:fixed;top:10px;right:12px;z-index:9999;display:flex;gap:4px;align-items:center;background:rgba(255,255,255,0.96);backdrop-filter:blur(10px);border:1px solid var(--gray3);border-radius:30px;padding:5px 8px;box-shadow:0 4px 20px rgba(0,0,0,0.12);flex-wrap:wrap;max-width:640px}
#role-switcher span{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
.rs-btn{border:none;background:none;padding:4px 9px;border-radius:20px;font-size:10.5px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--gray4);font-family:var(--font)}
.rs-btn.active{background:var(--green);color:#fff}
.rs-btn:hover:not(.active){background:var(--gray2)}

/* LAYOUT */
#app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);background:var(--dark);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;overflow-x:hidden}
.sidebar-brand{padding:16px 14px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-logo{display:flex;align-items:center;gap:10px}
.brand-icon{width:32px;height:32px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-icon svg{width:17px;height:17px;fill:#fff}
.brand-name{font-size:13px;font-weight:700;color:#fff;line-height:1.2}
.brand-sub{font-size:10px;color:rgba(255,255,255,.35)}
.user-badge{margin:10px 12px;background:rgba(255,255,255,.06);border-radius:var(--radius-sm);padding:9px 10px;display:flex;align-items:center;gap:9px}
.user-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.user-info-name{font-size:12px;font-weight:600;color:#fff;line-height:1.3}
.user-info-role{font-size:10px;color:rgba(255,255,255,.4)}
nav{flex:1;padding:6px 0}
.nav-section{padding:14px 14px 5px;font-size:9px;font-weight:700;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 14px;cursor:pointer;transition:all .15s;color:rgba(255,255,255,.55);font-size:12px;font-weight:500;border-left:3px solid transparent;margin:1px 0}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.9)}
.nav-item.active{background:rgba(45,138,86,.2);color:#fff;border-left-color:var(--green2)}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.nav-badge{margin-left:auto;background:var(--amber);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:var(--header-h);background:#fff;border-bottom:1px solid var(--gray3);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0;margin-top:0}
.topbar-title{font-size:15px;font-weight:700;color:var(--dark);flex:1;font-family:var(--serif)}
.topbar-search{display:flex;align-items:center;gap:7px;background:var(--gray2);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--gray)}
.topbar-search svg{width:13px;height:13px}
.topbar-icon{width:30px;height:30px;border-radius:50%;background:var(--gray2);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.topbar-icon svg{width:15px;height:15px;color:var(--gray)}
.notif-dot{position:absolute;top:5px;right:5px;width:6px;height:6px;background:var(--red);border-radius:50%;border:1.5px solid #fff}
#content{flex:1;overflow-y:auto;padding:20px}

/* PAGE */
.page-header{margin-bottom:20px}
.page-title{font-size:20px;font-weight:700;color:var(--dark);font-family:var(--serif)}
.page-sub{font-size:12px;color:var(--gray);margin-top:3px}

/* STATS GRID */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:var(--radius);padding:14px;border:1px solid var(--gray3)}
.stat-label{font-size:11px;color:var(--gray);font-weight:500;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:700;color:var(--dark)}
.stat-change{font-size:10px;margin-top:3px}
.stat-up{color:var(--green)}.stat-down{color:var(--red)}

/* CARDS */
.card{background:#fff;border-radius:var(--radius);border:1px solid var(--gray3);padding:18px}
.card-title{font-size:13px;font-weight:700;color:var(--dark);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.card-title-action{font-size:11px;font-weight:500;color:var(--green);cursor:pointer}

/* GRID LAYOUTS */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid-65{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.grid-56{display:grid;grid-template-columns:1fr 1.6fr;gap:14px}

/* TABLE */
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;padding:7px 10px;border-bottom:1px solid var(--gray3);background:var(--gray2)}
.data-table td{padding:9px 10px;border-bottom:1px solid var(--gray3);font-size:12.5px;color:var(--dark)}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--gray2)}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.badge-green{background:var(--green3);color:var(--green)}
.badge-amber{background:var(--amber2);color:var(--amber)}
.badge-red{background:var(--red2);color:var(--red)}
.badge-blue{background:var(--blue2);color:var(--blue)}
.badge-purple{background:var(--purple2);color:var(--purple)}
.badge-gray{background:var(--gray2);color:var(--gray)}
.badge-teal{background:var(--teal2);color:var(--teal)}

/* TIMELINE */
.timeline{display:flex;flex-direction:column;gap:11px}
.tl-item{display:flex;gap:10px;align-items:flex-start}
.tl-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0}
.tl-dot-green{background:var(--green)}.tl-dot-amber{background:var(--amber)}
.tl-dot-blue{background:var(--blue)}.tl-dot-red{background:var(--red)}
.tl-text{font-size:12px;color:var(--dark);line-height:1.4}
.tl-time{font-size:10px;color:var(--gray);margin-top:2px}

/* PROGRESS */
.progress-row{margin-bottom:10px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.progress-bar{height:6px;background:var(--gray3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:var(--green)}

/* AVATAR */
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:var(--font);transition:all .15s}
.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--green2)}
.btn-outline{background:#fff;color:var(--dark);border:1px solid var(--gray3)}.btn-outline:hover{background:var(--gray2)}
.btn-sm{padding:4px 9px;font-size:11px}

/* CALENDAR MINI */
.cal-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-mini .day-name{font-size:9px;font-weight:700;color:var(--gray);padding:3px 0}
.cal-mini .day{font-size:11px;padding:4px 2px;border-radius:4px;cursor:pointer}
.cal-mini .day:hover{background:var(--gray2)}
.cal-mini .today{background:var(--green);color:#fff;border-radius:4px}
.cal-mini .has-event{color:var(--green);font-weight:700}

/* BAR CHART */
.bar-chart{display:flex;align-items:flex-end;gap:7px;height:100px;margin-top:8px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar{width:100%;background:var(--green3);border-radius:3px 3px 0 0;transition:all .3s}
.bar:hover{background:var(--green2)}
.bar-label{font-size:9px;color:var(--gray)}
.bar-val{font-size:9px;font-weight:700;color:var(--dark)}

/* FORM */
.form-group{margin-bottom:12px}
.form-label{font-size:11px;font-weight:600;color:var(--gray4);margin-bottom:4px;display:block}
.form-input{width:100%;padding:7px 11px;border:1px solid var(--gray3);border-radius:var(--radius-sm);font-size:13px;font-family:var(--font);color:var(--dark);outline:none;background:#fff}
.form-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(26,107,60,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea.form-input{resize:vertical;min-height:70px}
select.form-input{cursor:pointer}

/* NOTIF */
.notif-item{display:flex;gap:9px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer}
.notif-item:hover{background:var(--gray2)}
.notif-item.unread{background:var(--green3)}

/* LOA OUTCOME */
.outcome-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.outcome-card{background:var(--gray2);border-radius:var(--radius-sm);padding:10px}
.outcome-name{font-size:11px;font-weight:600;color:var(--dark);margin-bottom:5px}
.outcome-pct{font-size:17px;font-weight:700;color:var(--green);margin-bottom:4px}

/* SCHEDULE */
.schedule-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--gray3)}
.schedule-item:last-child{border-bottom:none}
.schedule-time{font-size:11px;font-weight:600;color:var(--green);min-width:65px}
.schedule-subject{font-size:13px;font-weight:600;color:var(--dark)}
.schedule-class{font-size:11px;color:var(--gray)}
.schedule-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ATTENDANCE */
.att-grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.att-dot{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;cursor:pointer}
.att-h{background:var(--green3);color:var(--green)}
.att-s{background:var(--red2);color:var(--red)}
.att-i{background:var(--amber2);color:var(--amber)}
.att-a{background:var(--gray2);color:var(--gray)}

/* STUDENT */
.student-item{display:flex;align-items:center;gap:9px;padding:7px;border-radius:var(--radius-sm);cursor:pointer}
.student-item:hover{background:var(--gray2)}
.student-name{font-size:13px;font-weight:600;color:var(--dark)}
.student-info{font-size:11px;color:var(--gray)}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--gray3);border-radius:2px}

/* BILLING */
.billing-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--gray3)}
.billing-item:last-child{border-bottom:none}
.billing-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.billing-name{font-size:13px;font-weight:600;color:var(--dark)}
.billing-date{font-size:11px;color:var(--gray)}
.billing-amount{font-size:14px;font-weight:700;margin-left:auto}

/* PORTFOLIO */
.portfolio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:9px}
.portfolio-item{background:var(--gray2);border-radius:var(--radius-sm);overflow:hidden;cursor:pointer}
.portfolio-thumb{height:65px;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,var(--green3),var(--teal2))}
.portfolio-caption{padding:5px 7px;font-size:10px;font-weight:600;color:var(--dark)}
.portfolio-date{font-size:9px;color:var(--gray);padding:0 7px 5px}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--gray3);margin-bottom:16px}
.tab{padding:7px 14px;font-size:12px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.tab-content{display:none}.tab-content.active{display:block}

/* EVENT CARD */
.event-card{background:#fff;border-radius:var(--radius);border:1px solid var(--gray3);overflow:hidden;cursor:pointer;transition:box-shadow .2s}
.event-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.event-thumb{height:72px;display:flex;align-items:center;justify-content:center;font-size:30px}
.event-body{padding:11px}
.event-title{font-size:13px;font-weight:700;color:var(--dark);margin-bottom:3px}
.event-meta{font-size:11px;color:var(--gray)}
.event-footer{display:flex;justify-content:space-between;align-items:center;margin-top:7px}

/* RAPOR */
.rapor-subject{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--gray3)}
.rapor-subject:last-child{border-bottom:none}
.rapor-name{flex:1;font-size:13px;font-weight:600}
.rapor-score{font-size:16px;font-weight:700;color:var(--green)}
.rapor-grade{font-size:12px;font-weight:700;color:var(--amber);min-width:28px}
.rapor-desc{font-size:11px;color:var(--gray);flex:2}

/* AUDIT */
.audit-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--gray3);font-size:12px}
.audit-row:last-child{border-bottom:none}
.audit-time{color:var(--gray);min-width:50px;font-size:11px}
.audit-user{font-weight:600;min-width:140px}
.audit-target{color:var(--gray4);flex:1}

/* PAYMENT ROW */
.pay-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray3)}
.pay-row:last-child{border-bottom:none}
.pay-month{font-size:12px;font-weight:600;color:var(--dark);min-width:90px}
.pay-desc{font-size:11px;color:var(--gray);flex:1}
.pay-amount{font-size:13px;font-weight:700}
.pay-status{min-width:60px;text-align:right}

/* MONITOR */
.monitor-card{background:#fff;border-radius:var(--radius);border:1px solid var(--gray3);padding:12px;display:flex;align-items:center;gap:10px}
.monitor-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.monitor-count{font-size:22px;font-weight:700;color:var(--dark)}
.monitor-label{font-size:11px;color:var(--gray)}
.monitor-action{margin-left:auto;font-size:11px;color:var(--green);font-weight:600;cursor:pointer;white-space:nowrap}

/* EVIDENCE */
.evidence-zone{border:2px dashed var(--gray3);border-radius:var(--radius);padding:20px;text-align:center;color:var(--gray);font-size:12px;cursor:pointer;transition:.2s}
.evidence-zone:hover{border-color:var(--green);background:var(--green3)}
</style>
</head>

    html += `<div class="nav-section">${sec.section}</div>`;
    sec.items.forEach(item => {
      html += `<div class="nav-item${currentPage===item.id?' active':''}" id="nav-${item.id}" onclick="navigateTo('${item.id}')">${IC[item.icon]||''}<span>${item.label}</span></div>`;
    });
  });
  document.getElementById('sidebar-nav').innerHTML = html;
}

function navigateTo(pageId){
  currentPage = pageId;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const el = document.getElementById('nav-'+pageId);
  if(el) el.classList.add('active');
  let title = pageId;
  ROLES[currentRole].nav.forEach(s=>s.items.forEach(i=>{if(i.id===pageId)title=i.label;}));
  document.getElementById('topbar-title').textContent = title;
  document.getElementById('content').innerHTML = getPage(currentRole, pageId);
}

function switchRole(role, btn){
  currentRole = role; currentPage = 'dashboard';
  document.querySelectorAll('.rs-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderSidebar(role);
  navigateTo('dashboard');
}

// ============================================================
// TAB HELPER
// ============================================================
function switchTab(el, tid){
  const par = el.closest('.tabs');
  par.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  const tc = document.getElementById(tid);
  if(tc) tc.classList.add('active');
}
